<div class="hardcopy-console-ui is-minimized" data-hardcopy-root>
  <div class="hardcopy-header" data-hardcopy-header>
    <div class="hardcopy-header-left">
      <div class="notif-light" data-hardcopy-notif></div>
      <span data-hardcopy-title-full style="display:none"></span>
      <span data-hardcopy-title-mini>C:\</span>
    </div>
    <div class="hardcopy-header-actions" data-hardcopy-actions style="display:none">
      <button type="button" data-hardcopy-copy title="Copy Logs">📋</button>
      <button type="button" data-hardcopy-clear title="Clear Logs">🗑️</button>
      <span>[-]</span>
    </div>
  </div>
  <div class="hardcopy-body" data-hardcopy-body hidden>
    <div data-hardcopy-lines></div>
    <div class="hardcopy-prompt">
      <span class="hardcopy-prompt-gt">&gt;</span>
      <input type="text" data-hardcopy-input autocomplete="off">
      <div class="hardcopy-cursor"></div>
    </div>
  </div>
</div>
